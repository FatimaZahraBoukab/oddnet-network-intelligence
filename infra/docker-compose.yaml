
services:
 
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always

  # ============================================
  # KAFKA UI — interface visuelle pour voir les topics/messages
  # (optionnel mais très pratique pour débugger visuellement)
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092  

# ============================================
  # SPARK MASTER — le "chef" qui coordonne le traitement
  # ============================================
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: spark-master
    user: "root"
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ../processing:/opt/processing   # NOUVEAU : pont vers ton dossier processing/

  # ============================================
  # SPARK WORKER — celui qui exécute réellement le travail
  # ============================================
  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: spark-worker
    user: "root"
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ../processing:/opt/processing   # NOUVEAU : même chose pour le worker

# ============================================
  # MINIO — stockage objet façon S3, en local
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3 (utilisée par Spark pour lire/écrire)
      - "9001:9001"   # Interface web d'administration
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data   # stockage persistant (survit aux redémarrages)


  # ============================================
  # POSTGRES — base de données interne d'Airflow
  # ============================================
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data

  # ============================================
  # AIRFLOW INIT — initialise la base au premier lancement
  # ============================================
  airflow-init:
    image: apache/airflow:2.9.0
    container_name: airflow-init
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "boto3" 
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Fatima \
          --lastname Boukab \
          --role Admin \
          --email admin@oddnet.local \
          --password admin

  # ============================================
  # AIRFLOW WEBSERVER — interface web
  # ============================================
  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: airflow-webserver
    depends_on:
      - postgres-airflow
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "boto3" 
    ports:
      - "8082:8080"
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
    command: webserver

  # ============================================
  # AIRFLOW SCHEDULER — le "cerveau" qui déclenche les tâches
  # ============================================
  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: airflow-scheduler
    depends_on:
      - postgres-airflow
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "boto3" 
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
    command: scheduler

# ============================================
  # POSTGRES DASHBOARD — donnees pretes pour Grafana
  # ============================================
  postgres-dashboard:
    image: postgres:15
    container_name: postgres-dashboard
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: oddnet_dashboard
    ports:
      - "5433:5432"
    volumes:
      - postgres_dashboard_data:/var/lib/postgresql/data


  # ============================================
  # GRAFANA — dashboards visuels
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  minio_data:   # déclaration du volume nommé utilisé ci-dessus
  kafka_data:
  postgres_airflow_data:
  postgres_dashboard_data:
  grafana_data:

