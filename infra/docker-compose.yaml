
services:
  # ============================================
  # ZOOKEEPER — nécessaire pour que Kafka fonctionne
  # (il gère la coordination interne de Kafka)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ============================================
  # KAFKA — le broker qui reçoit/stocke/distribue nos données
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ============================================
  # KAFKA UI — interface visuelle pour voir les topics/messages
  # (optionnel mais très pratique pour débugger visuellement)
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092  

# ============================================
  # SPARK MASTER — le "chef" qui coordonne le traitement
  # ============================================
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: spark-master
    user: "root"
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ../processing:/opt/processing   # NOUVEAU : pont vers ton dossier processing/

  # ============================================
  # SPARK WORKER — celui qui exécute réellement le travail
  # ============================================
  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: spark-worker
    user: "root"
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ../processing:/opt/processing   # NOUVEAU : même chose pour le worker

# ============================================
  # MINIO — stockage objet façon S3, en local
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3 (utilisée par Spark pour lire/écrire)
      - "9001:9001"   # Interface web d'administration
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data   # stockage persistant (survit aux redémarrages)

volumes:
  minio_data:   # déclaration du volume nommé utilisé ci-dessus